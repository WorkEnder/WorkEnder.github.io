<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小夜的博客</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 背景大图（占 60% 屏，固定） -->
  <div class="banner-bg"></div>

  <!-- 顶部导航栏（贴边长方形） -->
  <header class="navbar">
    <nav class="nav-inner">
      <a href="index.html" class="brand">小夜的小站</a>
      <ul class="nav-links">
        <li><a href="index.html" class="active">首页</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="posts.html">文章</a></li>
      </ul>
      <button class="menu-toggle" aria-label="菜单">☰</button>
    </nav>
  </header>

  <!-- 灰色内容区（波浪顶部，跟随滚动） -->
  <div class="content-wrap has-banner">
    <!-- 波浪形顶部装饰 -->
    <div class="wave-wrap" aria-hidden="true">
      <svg class="wave wave-front" viewBox="0 0 1440 120" preserveAspectRatio="none">
        <path d="M0,80 C360,150 1080,0 1440,80 L1440,120 L0,120 Z" />
      </svg>
    </div>

    <main class="container">
      <div class="card profile-card">
        <div class="avatar">
          <img src="images/avatar.jpg" alt="头像" />
        </div>
        <div class="intro">
          <h1>你好，我是小夜 👋</h1>
          <p>
            这里是我的自我介绍，可以简单写写自己是谁、喜欢做什么、
            这个博客会分享什么内容等等。
          </p>
        </div>
      </div>

      <div class="card">
        <h2>最新文章</h2>
        <p>文章卡片会展示在这里，后续可以继续添加。</p>
      </div>
    </main>

    <footer class="footer">
      <p>© 2026 小夜 · Powered by GitHub Pages</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
