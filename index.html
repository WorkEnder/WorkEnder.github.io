<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小夜的博客</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 背景装饰光斑（毛玻璃效果更明显） -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <!-- 顶部导航栏 -->
  <header class="navbar">
    <nav class="nav-inner">
      <a href="index.html" class="brand">小夜的小站</a>
      <ul class="nav-links">
        <li><a href="index.html" class="active">首页</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="posts.html">文章</a></li>
      </ul>
      <!-- 手机端汉堡菜单按钮 -->
      <button class="menu-toggle" aria-label="菜单">☰</button>
    </nav>
  </header>

  <!-- 首屏大图 Banner -->
  <section class="hero">
    <img src="images/banner.jpg" alt="Banner 大图" class="hero-img" />
  </section>

  <!-- 主内容区：卡片式 -->
  <main class="container">
    <!-- 个人信息卡片 -->
    <div class="card profile-card">
      <div class="avatar">
        <img src="images/avatar.jpg" alt="头像" />
      </div>
      <div class="intro">
        <h1>你好，我是小夜 👋</h1>
        <p>
          这里是我的自我介绍，可以简单写写自己是谁、喜欢做什么、
          这个博客会分享什么内容等等。我先放一段占位文字，
          你之后替换成自己的介绍就好啦。
        </p>
      </div>
    </div>

    <!-- 预留文章卡片区（之后可继续添加） -->
    <div class="card">
      <h2>最新文章</h2>
      <p>文章卡片会展示在这里，后续可以继续添加。</p>
    </div>
  </main>

  <footer class="footer">
    <p>© 2026 小夜 · Powered by GitHub Pages</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
